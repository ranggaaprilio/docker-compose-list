server {
    listen 80;
    server_name jenkins.aprilio.dev;

    # Konfigurasi Reverse Proxy untuk Jenkins pada Subdomain Terpisah
    location / {
        # Meneruskan semua permintaan ke Jenkins MENGGUNAKAN NAMA KONTAINER
        proxy_pass http://jenkins:8080/; # <--- PASTIKAN ADA SLASH (/) DI AKHIR!
        
        # Header Penting untuk Komunikasi WebSocket dan Host/Port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Server $host;
        
        # Pengaturan Timeout 
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        # Pengaturan untuk WebSocket (penting untuk Jenkins Agents)
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pengaturan tambahan untuk mengatasi reverse proxy error
        proxy_redirect off;
        proxy_max_temp_file_size 0;
    }
    
    # Handle Jenkins CLI and other specific paths
    location ~* ^/(cli|jnlpJars|userContent|fingerprints|updateCenter) {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }
}
